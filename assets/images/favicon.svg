  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#lodgeGrad)" />
  <rect x="7" y="7" width="50" height="50" rx="13" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
